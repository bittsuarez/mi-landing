<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" role="img" aria-label="Ilustración de una casa contemporánea con ventanales, terraza y espejo de agua al atardecer">
  <defs>
    <linearGradient id="hsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe5e6"/>
      <stop offset=".58" stop-color="#e8e3d9"/>
      <stop offset="1" stop-color="#efdfc6"/>
    </linearGradient>
    <linearGradient id="hwall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f2ec"/>
      <stop offset="1" stop-color="#e3e0d7"/>
    </linearGradient>
    <linearGradient id="hglass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9e6bb"/>
      <stop offset="1" stop-color="#eec87a"/>
    </linearGradient>
    <linearGradient id="hwater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9cbcd"/>
      <stop offset="1" stop-color="#93aaae"/>
    </linearGradient>
    <linearGradient id="hdeck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdc4b2"/>
      <stop offset="1" stop-color="#b6ad99"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="960" fill="url(#hsky)"/>
  <circle cx="912" cy="382" r="74" fill="#f8e9cc" opacity=".9"/>
  <circle cx="912" cy="382" r="128" fill="#f6e6c4" opacity=".35"/>

  <!-- línea de árboles -->
  <g fill="#7b8a7c" opacity=".55">
    <circle cx="70" cy="452" r="78"/><circle cx="160" cy="478" r="62"/><circle cx="248" cy="462" r="70"/>
    <circle cx="1040" cy="466" r="74"/><circle cx="1136" cy="488" r="60"/><circle cx="962" cy="486" r="56"/>
  </g>
  <g fill="#68785f">
    <rect x="352" y="366" width="14" height="150" rx="5"/><circle cx="359" cy="352" r="62"/>
    <rect x="836" y="392" width="12" height="130" rx="5"/><circle cx="842" cy="376" r="52"/>
  </g>
  <rect y="506" width="1200" height="64" fill="#8c9a86"/>

  <!-- volumen trasero -->
  <rect x="726" y="336" width="286" height="204" fill="#e0ddd3"/>
  <rect x="714" y="322" width="310" height="20" rx="4" fill="#cfcbbf"/>
  <rect x="764" y="382" width="94" height="86" rx="3" fill="url(#hglass)"/>
  <rect x="890" y="382" width="86" height="86" rx="3" fill="#c3ced1"/>

  <!-- volumen principal -->
  <rect x="180" y="400" width="600" height="212" fill="url(#hwall)"/>
  <rect x="160" y="382" width="644" height="24" rx="5" fill="#d5d1c5"/>
  <rect x="180" y="400" width="600" height="212" fill="none"/>

  <!-- ventanal continuo -->
  <rect x="216" y="438" width="528" height="150" rx="3" fill="url(#hglass)"/>
  <g fill="#8e8a7c" opacity=".55">
    <rect x="348" y="438" width="8" height="150"/>
    <rect x="480" y="438" width="8" height="150"/>
    <rect x="612" y="438" width="8" height="150"/>
  </g>
  <!-- siluetas de interior -->
  <g fill="#a98f5f" opacity=".5">
    <rect x="252" y="524" width="72" height="44" rx="6"/>
    <rect x="396" y="512" width="20" height="56" rx="8"/>
    <circle cx="660" cy="498" r="16"/>
    <rect x="652" y="510" width="16" height="58" rx="5"/>
  </g>

  <!-- voladizo -->
  <rect x="148" y="600" width="672" height="18" rx="5" fill="#d5d1c5"/>
  <rect x="196" y="618" width="16" height="92" fill="#cbc7ba"/>
  <rect x="748" y="618" width="16" height="92" fill="#cbc7ba"/>

  <!-- muro lateral -->
  <rect x="112" y="430" width="70" height="182" fill="#dcd8ce"/>
  <rect x="100" y="416" width="94" height="18" rx="4" fill="#cbc7ba"/>

  <!-- terraza -->
  <rect y="710" width="1200" height="92" fill="url(#hdeck)"/>
  <g stroke="#a89f8a" stroke-width="3" opacity=".65">
    <path d="M0 734 L1200 734"/><path d="M0 764 L1200 764"/><path d="M0 792 L1200 792"/>
  </g>

  <!-- espejo de agua -->
  <rect y="802" width="1200" height="158" fill="url(#hwater)"/>
  <rect y="802" width="1200" height="10" fill="#dfd9c9"/>
  <!-- reflejos -->
  <g fill="#e2dcc9" opacity=".45">
    <rect x="216" y="828" width="528" height="46" rx="4"/>
    <rect x="764" y="836" width="94" height="30" rx="4"/>
  </g>
  <g stroke="#cfdcdd" stroke-width="5" stroke-linecap="round" opacity=".75">
    <path d="M120 888 L364 888"/><path d="M448 918 L806 918"/><path d="M842 878 L1076 878"/>
  </g>

  <!-- vegetación en primer plano -->
  <g fill="#6f8168">
    <circle cx="884" cy="702" r="42"/><circle cx="936" cy="716" r="30"/><circle cx="836" cy="718" r="26"/>
    <circle cx="86" cy="706" r="38"/><circle cx="34" cy="722" r="26"/>
  </g>
  <g fill="#5e7058">
    <path d="M1090 710 q 14 -70 34 -96 q 6 60 -8 96 Z"/>
    <path d="M1122 710 q 30 -56 56 -70 q -12 46 -34 70 Z"/>
  </g>
</svg>
