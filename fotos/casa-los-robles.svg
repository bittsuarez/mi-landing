<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Ilustración de una casa de dos plantas con jardín y robles">
  <defs>
    <linearGradient id="c1sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ebe6"/>
      <stop offset="1" stop-color="#c3d0c5"/>
    </linearGradient>
    <linearGradient id="c1lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93a894"/>
      <stop offset="1" stop-color="#7b9282"/>
    </linearGradient>
    <linearGradient id="c1roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46534d"/>
      <stop offset="1" stop-color="#36423d"/>
    </linearGradient>
    <linearGradient id="c1glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e3b4"/>
      <stop offset="1" stop-color="#eec978"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#c1sky)"/>
  <circle cx="948" cy="168" r="62" fill="#f4ecd8" opacity=".85"/>

  <!-- colinas -->
  <path d="M0 596 C 150 540 300 566 430 592 C 560 618 640 600 760 572 C 890 542 1060 560 1200 590 L1200 640 L0 640 Z" fill="#a9b8ac"/>
  <path d="M0 620 C 180 588 340 614 520 618 C 700 622 900 600 1200 618 L1200 660 L0 660 Z" fill="#98ab9c"/>

  <!-- suelo -->
  <rect y="620" width="1200" height="280" fill="url(#c1lawn)"/>

  <!-- robles traseros -->
  <g fill="#556c5b">
    <rect x="171" y="470" width="18" height="160" rx="6"/>
    <circle cx="180" cy="452" r="86"/><circle cx="124" cy="488" r="58"/><circle cx="238" cy="486" r="60"/>
  </g>
  <g fill="#4a6151">
    <rect x="1024" y="452" width="20" height="180" rx="7"/>
    <circle cx="1034" cy="430" r="96"/><circle cx="968" cy="472" r="62"/><circle cx="1100" cy="470" r="64"/>
  </g>

  <!-- sombra de la casa -->
  <ellipse cx="600" cy="634" rx="330" ry="26" fill="#5f7466" opacity=".38"/>

  <!-- cuerpo -->
  <rect x="345" y="330" width="510" height="292" fill="#f2f0e8"/>
  <rect x="700" y="330" width="155" height="292" fill="#dedbd0"/>

  <!-- tejado -->
  <path d="M600 196 L906 342 L294 342 Z" fill="url(#c1roof)"/>
  <path d="M600 196 L906 342 L855 342 L600 220 Z" fill="#2d3833"/>

  <!-- chimenea -->
  <rect x="742" y="228" width="40" height="76" fill="#3c4842"/>
  <rect x="734" y="220" width="56" height="16" rx="3" fill="#2d3833"/>

  <!-- ventanas planta alta -->
  <g fill="url(#c1glow)">
    <rect x="404" y="378" width="82" height="92" rx="4"/>
    <rect x="520" y="378" width="82" height="92" rx="4"/>
    <rect x="636" y="378" width="82" height="92" rx="4"/>
    <rect x="752" y="378" width="72" height="92" rx="4"/>
  </g>
  <g fill="#3c4842" opacity=".55">
    <rect x="441" y="378" width="6" height="92"/><rect x="557" y="378" width="6" height="92"/>
    <rect x="673" y="378" width="6" height="92"/><rect x="785" y="378" width="6" height="92"/>
    <rect x="404" y="418" width="82" height="6"/><rect x="520" y="418" width="82" height="6"/>
    <rect x="636" y="418" width="82" height="6"/><rect x="752" y="418" width="72" height="6"/>
  </g>

  <!-- planta baja: ventanal y puerta -->
  <rect x="404" y="506" width="180" height="116" rx="4" fill="url(#c1glow)"/>
  <rect x="490" y="506" width="7" height="116" fill="#3c4842" opacity=".55"/>
  <rect x="636" y="494" width="96" height="128" rx="5" fill="#3c4842"/>
  <rect x="650" y="508" width="68" height="60" rx="3" fill="#9db0a3"/>
  <circle cx="716" cy="566" r="5" fill="#e8d5a4"/>

  <!-- porche -->
  <rect x="612" y="482" width="144" height="12" rx="4" fill="#e6e3d8"/>
  <rect x="618" y="494" width="10" height="128" fill="#e6e3d8"/>
  <rect x="740" y="494" width="10" height="128" fill="#d6d3c8"/>

  <!-- camino -->
  <path d="M660 622 L724 900 L520 900 L620 622 Z" fill="#c6c9bd"/>
  <g fill="#b3b7ab">
    <rect x="600" y="668" width="80" height="7" rx="3"/>
    <rect x="586" y="728" width="110" height="8" rx="4"/>
    <rect x="568" y="796" width="146" height="9" rx="4"/>
  </g>

  <!-- arbustos -->
  <g fill="#6a8271">
    <circle cx="398" cy="628" r="34"/><circle cx="448" cy="636" r="26"/>
    <circle cx="808" cy="632" r="30"/><circle cx="856" cy="640" r="22"/>
  </g>
  <g fill="#5d7464" opacity=".8">
    <circle cx="148" cy="700" r="24"/><circle cx="1064" cy="716" r="28"/>
  </g>
</svg>
